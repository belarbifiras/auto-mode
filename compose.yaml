services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-automode}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - automode-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-automode}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./automodebackend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-automode}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me-32bytes}
      APP_SEED_DATA: ${APP_SEED_DATA:-true}
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  automode-postgres:
